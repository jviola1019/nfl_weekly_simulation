name: Odds live smoke

# Manual only. Makes a handful of real requests (1 request/second) to ESPN and Kalshi and
# compares them with the recorded fixtures, to catch API drift. Not part of CI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install dependencies
        run: install.packages(c("lubridate", "httr2", "jsonlite", "digest", "testthat", "curl", "withr"))
        shell: Rscript {0}

      - name: Live smoke
        run: Rscript scripts/odds_live_smoke.R
