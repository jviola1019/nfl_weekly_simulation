name: Weekly simulation

# The online half of A8: the deployed app reads the same simulator bundle that the offline
# app (cd web && npm run local) reads. run_week.R writes it with R/sim_bundle.R, the web's
# own loader checks it (hashes, schema, every row), it is kept as an artifact, and it is
# ingested into the deployed database only when the DATABASE_URL secret exists. Deployment
# (Vercel, Neon) waits for the owner; until then the ingest job is skipped and says why.
# It runs at the two decision points (C1, 2026-10-20): Tuesday 18:00Z and Friday 21:00Z, for the
# upcoming week from the nflverse schedule (scripts/resolve_week.R). A manual run may name a week
# and season; the sealed 2025 is refused whichever way the season was chosen.
# tests/testthat/test-workflows.R pins the job graph, the permissions and the secret gate.

on:
  schedule:
    - cron: "0 18 * * 2"   # Tuesday 18:00Z, the primary decision point
    - cron: "0 21 * * 5"   # Friday 21:00Z, after the injury report
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (1-22; 19-22 are the playoffs). Empty: the upcoming week from the schedule"
        required: false
        type: string
      season:
        description: "Season (2011-2030, except the sealed 2025). Empty: the season in progress"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-sim
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      bundle: ${{ steps.bundle.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Reject a malformed week or season
        env:
          WEEK: ${{ inputs.week }}
          SEASON: ${{ inputs.season }}
        run: |
          if [ -n "$WEEK" ] && ! [[ "$WEEK" =~ ^[0-9]{1,2}$ ]]; then echo "::error::week must be one or two digits (got '$WEEK')"; exit 1; fi
          if [ -n "$SEASON" ] && ! [[ "$SEASON" =~ ^[0-9]{4}$ ]]; then echo "::error::season must be four digits (got '$SEASON')"; exit 1; fi
          if [ -z "$WEEK" ] && [ -n "$SEASON" ]; then echo "::error::a season needs a week (leave both empty for the upcoming week)"; exit 1; fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev gfortran

      - uses: r-lib/actions/setup-renv@v2

      - name: Resolve the week (empty inputs mean the upcoming week from the nflverse schedule)
        id: target
        env:
          WEEK: ${{ inputs.week }}
          SEASON: ${{ inputs.season }}
        run: Rscript scripts/resolve_week.R "$WEEK" "$SEASON" >> "$GITHUB_OUTPUT"

      - name: Refuse the sealed 2025 season
        env:
          SEASON: ${{ steps.target.outputs.season }}
        run: |
          if [ "$SEASON" = "2025" ]; then echo "::error::2025 data stays sealed (owner rule; the 2025 holdout is scored once, A2)"; exit 1; fi

      - name: Run the weekly simulation (writes bundles/<season>-w<WW>-sim-<UTC stamp>/)
        env:
          WEEK: ${{ steps.target.outputs.week }}
          SEASON: ${{ steps.target.outputs.season }}
        run: Rscript run_week.R "$WEEK" "$SEASON"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web app
        working-directory: web
        run: npm ci

      - name: Check the bundle the way the ingest will
        id: bundle
        run: |
          dir="$(ls -d bundles/*-sim-* 2>/dev/null | sort | tail -n 1)"
          if [ -z "$dir" ]; then echo "::error::run_week.R wrote no simulator bundle"; exit 1; fi
          echo "name=$(basename "$dir")" >> "$GITHUB_OUTPUT"
          cd web && npm run check-bundle -- "../$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: sim-bundle
          path: bundles/${{ steps.bundle.outputs.name }}/
          if-no-files-found: error
          retention-days: 90

  gate:
    runs-on: ubuntu-latest
    outputs:
      has_db: ${{ steps.check.outputs.has_db }}
    steps:
      - name: Is there a database to ingest into?
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DATABASE_URL secret: the bundle is kept as an artifact and not ingested (deployment is pending owner approval)."
          fi

  ingest:
    needs: [simulate, gate]
    if: needs.gate.outputs.has_db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the web app
        working-directory: web
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: sim-bundle
          path: sim-bundle

      - name: Migrate, then ingest (idempotent on the bundle sha; a QA-failed run keeps the last good one published)
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run db:migrate
          npm run ingest -- ../sim-bundle
